[project]
name = "dwgcheck"
version = "0.1.0"
description = "Detect-only integrity verifier for DWG files (AC1024/AC1027/AC1032)"
authors = [
    { name = "realDragonium", email = "drago@dragonium.nl" }
]
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
# Tier 2 only. Tier 1 is stdlib-only and must stay that way.
deep = ["ezdxf>=1.3"]

[project.scripts]
dwgcheck = "dwgcheck.cli:main"

[dependency-groups]
dev = ["pytest>=8", "mypy>=1.11"]

[build-system]
requires = ["uv_build>=0.9.18,<0.10.0"]
build-backend = "uv_build"

[tool.mypy]
strict = true
files = ["src", "tests", "tools"]

[[tool.mypy.overrides]]
module = ["ezdxf", "ezdxf.*"]
follow_untyped_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["deep: needs the ODA File Converter (Tier 2)"]
